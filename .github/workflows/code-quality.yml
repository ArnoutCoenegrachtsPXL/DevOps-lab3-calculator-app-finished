name: code quality
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.0

    - name: Get dependencies
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: install npm
      run: npm ci

    - name: building code
      run: npm run build --if-present

    - name: running tests
      run: npm test

    - name: generate test report
      uses: mridang/action-test-reporter@v1.7.0
      with:
        coverage-file: './clover.xml'

    - name: bundle code
      run: zip -r app.zip app.js routes.js server.js node_modules

  test:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Get dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: install npm
        run: npm ci

      - name: building code
        run: npm run build --if-present

      - name: ESLint
        run: npm run lint
      
      - name: Prettier
        run: |
          npm run format
          npm run format:check

      - name: Security audit
        run: npm audit
    