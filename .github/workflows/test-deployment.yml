name: Test deployment
on: 
  workflow_dispatch

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: pull container
      run: docker pull arnoutcoenegrachtspxl/app:latest

    - name: stop any running containers
      run: |
        docker ps -q | wc -l
        if [ $(!!) -gt 0];
          then
             docker rm -f -v $(docker ps -aq)
        fi
    - name: run container
      run: docker run -p 3000:3000 arnoutcoenegrachtspxl/app:latest