name: Test deployment
on: 
  workflow_dispatch

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: pull container
      run: docker pull arnoutcoenegrachtspxl/app:latest

    - name: stop any running containers
      run: docker rm -f -v $(docker ps -aq) || true
      
    - name: run container
      run: docker run -p 8000:3000 -d arnoutcoenegrachtspxl/app:latest